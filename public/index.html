<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Database Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>MSU Catalog</h1>

      <label for="db-select">Database</label>
      <select id="db-select">
        <option value="authors">Names</option>
      </select>

      <button id="upload-btn">Import HTML or CSV</button>
      <input type="file" id="upload-file" accept=".htm,.html,.csv" hidden>

      <button id = "check-all-btn">Check &amp; Convert All</button>

      <label for="new-entry-select">Select New Entry</label>
      <select id="new-entry-select">
        <option value="">Loading...</option>
      </select>

      <div id="status"></div>
    </aside>

    <main class="content">
      <div class="toolbar">
        <button id="prev-btn">← Prev</button>
        <span id="page-info"></span>
        <button id="next-btn">Next →</button>

        <form id = "search-form" class = "search-form">
          <input type = "text" id = "search-input" placeholder = "Search">
          <button type = "submit">Search</button>
        </form>
      </div>

      <table id="records">
        <thead>
          <tr>
            <th>Tag</th>
            <th>Canonical Name</th>
            <th>Percent Match</th>
            <th>LCN</th>
            <th>Comments</th>
            <th>Date</th>
            <th>Assoc ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
